<title>スイッチキュー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#12141c;
  --surface:#1a1d29;
  --surface-2:#232739;
  --surface-3:#2c3146;
  --border:#333853;
  --text:#eef0f6;
  --text-dim:#98a0ba;
  --text-faint:#5c6280;
  --accent:#ffb04d;
  --accent-rgb:255,176,77;
  --live:#ff3b57;
  --live-rgb:255,59,87;
  --accent2:#48d7ff;
  --ok:#3ddc84;
  --radius:16px;
  --radius-sm:10px;
  --font-ui:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

.app{
  display:flex;
  flex-direction:column;
  height:100%;
  max-width:1240px;
  margin:0 auto;
  width:100%;
}

/* ---------- header ---------- */
.header{
  flex:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;
  background:linear-gradient(180deg,var(--surface),rgba(26,29,41,0.0));
  border-bottom:1px solid var(--border);
}
.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
@media (max-width:400px){
  .save-status .label{display:none;}
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand-mark{
  font-weight:900;
  font-size:17px;
  letter-spacing:.02em;
}
.brand-mark .dot{color:var(--live);}
.brand-sub{
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:.04em;
}
.mode-toggle{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--text-dim);
  cursor:pointer;
  user-select:none;
  padding:6px 10px 6px 6px;
  border-radius:999px;
  background:var(--surface-2);
  border:1px solid var(--border);
}
.switch{
  width:34px;height:20px;border-radius:999px;background:var(--surface-3);
  position:relative;flex:none;transition:background .15s ease;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--text-dim);transition:transform .15s ease,background .15s ease;
}
.mode-toggle.on .switch{background:rgba(255,176,77,.35);}
.mode-toggle.on .switch::after{transform:translateX(14px);background:var(--accent);}
.mode-toggle.on{color:var(--accent);}

.hdr-actions{display:flex;align-items:center;gap:8px;}
.save-status{
  font-size:10.5px;color:var(--text-faint);white-space:nowrap;
  display:flex;align-items:center;gap:4px;
}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
.save-status.bad .dot{background:var(--live);}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  transform:translateX(-50%) translateY(8px);
  max-width:calc(100% - 32px);
  background:var(--surface-3);
  color:var(--text);
  padding:9px 16px;
  border-radius:999px;
  font-size:12.5px;
  font-weight:600;
  border:1px solid var(--border);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
  z-index:80;
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:rgba(var(--live-rgb),.6);color:var(--live);}

.songrail{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
.songrail::-webkit-scrollbar{display:none;}
.chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:999px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-size:12.5px;
  white-space:nowrap;
  cursor:pointer;
}
.chip .num{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-faint);
}
.chip.active{
  background:rgba(var(--live-rgb),.14);
  border-color:rgba(var(--live-rgb),.55);
  color:var(--text);
}
.chip.active .num{color:var(--live);}
.chip .chip-x{
  color:var(--text-faint);
  padding-left:2px;
  font-size:14px;
  line-height:1;
}
.chip.add{
  color:var(--accent);
  border-style:dashed;
  border-color:rgba(var(--accent-rgb),.5);
}

/* ---------- main ---------- */
.main{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px 16px 12px;
}
.main-grid{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.hero-col,.cue-col{
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}
@media (min-width:860px){
  .main-grid{
    display:grid;
    grid-template-columns:minmax(300px,380px) 1fr;
    gap:28px;
    align-items:start;
  }
  .hero-col{
    position:sticky;
    top:0;
  }
}
.song-title-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}
.song-title{
  font-size:18px;
  font-weight:700;
  cursor:default;
}
.song-title.editable{cursor:text;border-bottom:1px dashed var(--text-faint);}
.song-title-input{
  font-size:18px;font-weight:700;background:transparent;border:none;border-bottom:1px solid var(--accent);
  color:var(--text);width:100%;padding:0 0 2px;outline:none;
}
.song-meta{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-faint);
  flex:none;
}
.song-meta.editable{cursor:text;border-bottom:1px dashed var(--text-faint);}
.song-meta-input{
  font-family:var(--font-mono);font-size:12px;background:var(--surface-2);
  border:1px solid var(--accent);border-radius:6px;color:var(--text);
  width:64px;text-align:right;padding:3px 6px;outline:none;
}
.caveat{
  font-size:11px;
  color:var(--text-faint);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:8px 10px;
  line-height:1.5;
}
.caveat b{color:var(--text-dim);}

/* timeline */
.timeline-wrap{position:relative;}
.timeline{
  position:relative;
  height:44px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.timeline-fill{
  position:absolute;top:0;bottom:0;left:0;
  background:linear-gradient(90deg,rgba(var(--live-rgb),.22),rgba(var(--live-rgb),.06));
}
.timeline-mark{
  position:absolute;top:0;bottom:0;width:1px;background:var(--border);
}
.timeline-mark.past{background:rgba(var(--live-rgb),.4);}
.timeline-playhead{
  position:absolute;top:0;bottom:0;width:2px;background:var(--live);
  box-shadow:0 0 10px 1px rgba(var(--live-rgb),.8);
  transition:left .2s linear;
}
.timeline-time{
  display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:4px;
}

/* now card */
.now-card{
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--border);
  padding:18px 18px 16px;
  position:relative;
  overflow:hidden;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.now-card.live{
  border-color:rgba(var(--live-rgb),.6);
  box-shadow:0 0 0 1px rgba(var(--live-rgb),.15),0 0 26px rgba(var(--live-rgb),.18);
}
.now-card.live::before{
  content:'ON AIR';
  position:absolute;top:12px;right:14px;
  font-family:var(--font-mono);
  font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--live);
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,55%{opacity:1;}60%,100%{opacity:.35;}}
.now-eyebrow{
  font-size:11px;color:var(--text-faint);letter-spacing:.06em;margin-bottom:6px;
}
.now-label{
  font-size:26px;font-weight:900;line-height:1.15;margin-bottom:8px;
  text-wrap:balance;
}
.now-performer{
  display:inline-flex;align-items:center;
  padding:6px 12px;
  border-radius:999px;
  font-size:14px;font-weight:600;
}
.now-note{margin-top:10px;font-size:14.5px;color:var(--text);line-height:1.55;}
.now-empty{color:var(--text-faint);font-size:13px;}

.next-strip{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  background:var(--surface-2);
  border:1px solid var(--border);
  font-size:12.5px;
  color:var(--text-dim);
}
.next-strip.soon{
  border-color:rgba(var(--accent-rgb),.6);
  background:rgba(var(--accent-rgb),.1);
  color:var(--accent);
}
.next-strip .tag{
  flex:none;font-size:10px;letter-spacing:.06em;color:var(--text-faint);
}
.next-strip.soon .tag{color:var(--accent);}
.next-strip .body{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.next-strip .eta{
  flex:none;font-family:var(--font-mono);font-weight:700;
}

/* cue list */
.cue-list-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--text-faint);
}
.cue-list{
  display:flex;flex-direction:column;gap:6px;
}
.cue-row{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid transparent;
  cursor:pointer;
}
.cue-row.past{opacity:.5;}
.cue-row.current{
  border-left-color:var(--live);
  background:rgba(var(--live-rgb),.08);
}
.cue-time{
  flex:none;
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--text-dim);
  padding-top:2px;
  min-width:38px;
}
.cue-row.current .cue-time{color:var(--live);font-weight:700;}
.cue-body{flex:1;min-width:0;}
.cue-label{font-size:14px;font-weight:700;margin-bottom:3px;}
.cue-performer{
  display:inline-block;
  font-size:11.5px;font-weight:600;
  padding:2px 8px;border-radius:999px;
  margin-right:6px;
}
.cue-performer.empty{color:var(--text-faint);font-style:italic;font-weight:500;background:transparent;padding-left:0;}
.cue-note{font-size:13.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
.cue-actions{flex:none;display:flex;gap:4px;}
.icon-btn{
  border:none;background:var(--surface-2);color:var(--text-dim);
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;
}
.icon-btn:active{background:var(--surface-3);}
.icon-btn.danger{color:var(--live);}

.cue-edit-form{
  display:flex;flex-direction:column;gap:6px;width:100%;
}
.cue-edit-row{display:flex;gap:6px;}
.cue-edit-row input{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:7px 8px;font-size:13px;outline:none;
}
.cue-edit-row input:focus{border-color:var(--accent);}
.f-time{width:64px;font-family:var(--font-mono);flex:none;}
.f-label{flex:1.2;min-width:0;}
.f-performer{flex:1;min-width:0;}
.f-note{width:100%;}
.cue-edit-actions{display:flex;gap:6px;justify-content:flex-end;}
.btn{
  border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.btn-save{background:var(--accent);color:#221400;}
.btn-cancel{background:var(--surface-2);color:var(--text-dim);}

.add-cue-btn,.add-song-inline{
  border:1px dashed var(--border);
  background:transparent;
  color:var(--text-faint);
  border-radius:var(--radius-sm);
  padding:10px;
  font-size:12.5px;
  cursor:pointer;
}
.add-cue-btn:active{background:var(--surface-2);}

.empty-state{
  text-align:center;color:var(--text-faint);font-size:13px;padding:24px 10px;
}

/* ---------- transport ---------- */
.transport{
  flex:none;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(0deg,var(--surface),rgba(26,29,41,0));
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}
.t-btn{
  border:none;background:var(--surface-2);color:var(--text-dim);
  border-radius:999px;
  font-family:var(--font-mono);font-size:12px;font-weight:700;
  padding:0 14px;height:40px;
  cursor:pointer;
}
.t-btn:active{background:var(--surface-3);}
.t-play{
  width:64px;height:64px;border-radius:50%;
  background:var(--live);color:#fff;
  font-size:22px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(var(--live-rgb),.14);
  border:none;cursor:pointer;flex:none;
}
.t-play.playing{background:var(--surface-3);color:var(--live);box-shadow:0 0 0 6px rgba(var(--live-rgb),.08);}
.t-play:active{transform:scale(.96);}
.clock{
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--text-faint);
  position:absolute;
  left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
}

@media (max-width:400px){
  .now-label{font-size:22px;}
  .header{padding-left:12px;padding-right:12px;}
  .main{padding-left:12px;padding-right:12px;}
}
</style>

<div class="app" id="app"></div>

<script>
(function(){
  "use strict";

  var AUTO_ADVANCE_DELAY_MS = 4000;

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();

  /* Seed data: songs 1-3 are a first-pass read of the rehearsal videos
     (frame + loudness based, see analysisNote); 4-19 are duration-scaled

    if (/^\d+$/.test(str)) return parseInt(str,10);
    return null;
  }

    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = 'toast'; }, 2200);
  }

  async function exportBackup(){
    var data = JSON.stringify(state.songs, null, 2);
    var d = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    var filename = 'switchcue_backup_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';

    if (window.claude && window.claude.use){
      try{
        var downloads = await window.claude.use('downloads');
        if (downloads){
          await downloads.save({filename:filename, data:new Blob([data], {type:'application/json'})});
          showToast('バックアップファイルを書き出しました');
          return;
        }
      } catch(e){
        if (e && e.code==='declined'){ return; }
        showToast('書き出しに失敗しました', true);
        return;
      }
    }
    try{
      var blob = new Blob([data], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast('バックアップファイルを書き出しました');
    } catch(e){
      showToast('書き出しに失敗しました', true);
    }
  }

  function importBackupFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed) || !parsed.length) throw new Error('empty');
      } catch(e){
        showToast('読み込みに失敗しました（ファイル形式を確認してください）', true);
        return;
      }
      if (!confirm('現在のデータを、このバックアップファイルの内容で置き換えます。よろしいですか？')) return;
      var oldSongs = state.songs;
      state.songs = parsed;
      if (!state.songs.some(function(s){ return s.id===state.selectedId; })){
        state.selectedId = state.songs.length ? state.songs[0].id : null;
      }
      if (state.db){
        var newIds = parsed.map(function(s){ return s.id; });
        oldSongs.forEach(function(old){
          if (newIds.indexOf(old.id)===-1) state.db.doc('songs/'+old.id).delete().catch(function(){});
        });
        parsed.forEach(function(s){
          state.db.doc('songs/'+s.id).set({
            order:s.order, title:s.title, durationSec:s.durationSec,
            cues:s.cues||[], analyzed:!!s.analyzed, analysisNote:s.analysisNote||''
          }).catch(function(){});
        });
      } else {
        saveLocal();
      }
      renderAll();
      showToast('バックアップを読み込みました');
    };
    reader.onerror = function(){ showToast('ファイルの読み込みに失敗しました', true); };
    reader.readAsText(file);
  }

  function currentSong(){
    return state.songs.find(function(s){ return s.id===state.selectedId; }) || null;
  }

  function sortedCues(song){
    if (!song) return [];
    return song.cues.slice().sort(function(a,b){ return a.time-b.time; });
  }

  function elapsedSec(){
    if (state.running) return (performance.now() - state.startEpoch)/1000;
    return state.elapsedMs/1000;
  }

  function findCurrentAndNext(cues, t){
    var current = null, next = null;
    for (var i=0;i<cues.length;i++){
      if (cues[i].time <= t) current = cues[i]; else { next = cues[i]; break; }
    }
    return {current:current, next:next};
  }

  /* ---------------- db ---------------- */
  var unsubscribe = null;

  async function initDb(){
    if (window.claude && window.claude.use){
      try { state.db = await window.claude.use('db'); } catch(e){ state.db = null; }
    }
    if (state.db){
      state.dbReady = true;
      subscribeSongs();
      return;
    }
    loadLocalOrSeed();
    renderAll();
  }

  function loadLocalOrSeed(){
    var raw = localGet('switchcue_songs_v1', null);
    if (raw){
      try{
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) state.songs = parsed;
      } catch(e){}
    }
    if (!state.songs.length){
      state.songs = cloneSeed();
      saveLocal();
    }
    if (!state.selectedId || !state.songs.some(function(s){return s.id===state.selectedId;})){
      state.selectedId = state.songs[0].id;
    }
  }

  function saveLocal(){
    localSet('switchcue_songs_v1', JSON.stringify(state.songs));
  }

  function subscribeSongs(){
    var col = state.db.collection('songs');
    unsubscribe = col.orderBy('order').onSnapshot(function(snap){
      var songs = snap.docs.map(function(d){
        var data = d.data() || {};
        return {
          id: d.id,
          order: typeof data.order==='number' ? data.order : 0,
          title: data.title || '(無題)',
          durationSec: typeof data.durationSec==='number' ? data.durationSec : 180,
          cues: Array.isArray(data.cues) ? data.cues : [],
          analysisNote: data.analysisNote || '',
          analyzed: !!data.analyzed
        };
      });
      var wasEmpty = state.songs.length===0 && !state.selectedId;
      state.songs = songs;
      if (songs.length===0){
        seedSongs();
        return;
      }
      if (!state.selectedId || !songs.some(function(s){return s.id===state.selectedId;})){
        state.selectedId = songs[0].id;
      }
      renderAll();
    }, function(err){
      state.db = null;
      renderAll();
    });
  }

  var seeding = false;
  async function seedSongs(){
    if (seeding) return;
    seeding = true;
    try{
      var seed = cloneSeed();
      for (var i=0;i<seed.length;i++){
        var s = seed[i];
        var ref = state.db.doc('songs/'+s.id);
        var snap = await ref.get();
        if (!snap.exists){
          await ref.set({
            order:s.order, title:s.title, durationSec:s.durationSec,
            cues:s.cues, analyzed:s.analyzed, analysisNote:s.analysisNote
          });
        }
      }
    } catch(e){ /* leave whatever got created */ }
    seeding = false;
  }

  function persistAndNotify(remoteWrite){
    if (state.db){
      state.lastSaveOk = true;
      renderAll();
      showToast('保存しました（クラウド）');
      remoteWrite().catch(function(){
        state.lastSaveOk = false;
        var el = document.getElementById('saveStatus');
        if (el) el.className = 'save-status bad';
        showToast('保存に失敗しました。通信状況を確認してください', true);
      });
    } else {
      var ok = saveLocal();
      state.lastSaveOk = ok;
      renderAll();
      showToast(ok ? '保存しました（この端末に保存）' : '保存できません。右上の「⬇」でバックアップを書き出してください', !ok);
    }
  }

  function writeCues(songId, cues){
    var song = state.songs.find(function(s){return s.id===songId;});
    if (song) song.cues = cues; // optimistic
    persistAndNotify(function(){ return state.db.doc('songs/'+songId).update({cues:cues}); });
  }

  function writeSongField(songId, field, value){
    var song = state.songs.find(function(s){return s.id===songId;});
    if (song) song[field] = value;
    persistAndNotify(function(){
      var patch = {}; patch[field]=value;
      return state.db.doc('songs/'+songId).update(patch);
    });
  }

  function addSong(){
    var order = state.songs.reduce(function(m,s){return Math.max(m,s.order);},0)+1;
    var id = 'song-'+uid();
    var song = {id:id, order:order, title:'新しい曲', durationSec:180, cues: defaultCuesForNewSong(180), analyzed:false, analysisNote:''};
    state.songs.push(song);
    state.selectedId = id;
    persistAndNotify(function(){
      return state.db.doc('songs/'+id).set({order:order,title:song.title,durationSec:song.durationSec,cues:song.cues,analyzed:false,analysisNote:''});
    });
  }

  function deleteSong(songId){
    var idx = state.songs.findIndex(function(s){return s.id===songId;});
    if (idx<0) return;
    var wasSelected = state.selectedId===songId;
    state.songs.splice(idx,1);
    if (wasSelected){
      clearAutoAdvance();
      state.running = false;
      stopTicking();
      state.elapsedMs = 0;
      state.selectedId = state.songs.length ? state.songs[Math.min(idx,state.songs.length-1)].id : null;
    }
    persistAndNotify(function(){ return state.db.doc('songs/'+songId).delete(); });
  }

  /* ---------------- transport ---------------- */
  function clearAutoAdvance(){
    if (state.autoAdvanceTimer){ clearTimeout(state.autoAdvanceTimer); state.autoAdvanceTimer = null; }
  }

  function advanceToNextSong(){
    var ordered = state.songs.slice().sort(function(a,b){ return a.order-b.order; });
    var idx = ordered.findIndex(function(s){ return s.id===state.selectedId; });
    state.running = false;
    stopTicking();
    if (idx<0 || idx+1>=ordered.length){
      state.elapsedMs = 0;
      renderTransport();
      renderNowNext();
      showToast('セットリストの最後の曲です');
      return;
    }
    var next = ordered[idx+1];
    state.elapsedMs = 0;
    state.selectedId = next.id;
    state.editingCueId = null;
    state.editingSongTitle = false;
    state.editingDuration = false;
    state.addingCue = false;
    state.lastCurrentCueId = undefined;
    renderAll();
    showToast('次の曲「'+next.title+'」の頭で待機中');
  }

  function play(){
    if (state.running) return;
    clearAutoAdvance();
    state.startEpoch = performance.now() - state.elapsedMs;
    state.running = true;
    startTicking();
    renderTransport();
  }
  function pause(){
    if (!state.running) return;
    clearAutoAdvance();
    state.elapsedMs = performance.now() - state.startEpoch;
    state.running = false;
    stopTicking();
    renderTransport();
    renderNowNext();
  }
  function reset(){
    clearAutoAdvance();
    state.running = false;
    state.elapsedMs = 0;
    stopTicking();
    state.lastCurrentCueId = undefined;
    renderTransport();
    renderNowNext();
    scrollToCurrent();
  }
  function nudge(deltaSec){
    clearAutoAdvance();
    var ms = deltaSec*1000;
    if (state.running) state.startEpoch -= ms;
    else state.elapsedMs = Math.max(0, state.elapsedMs+ms);
    renderNowNext();
  }
  function jumpTo(sec){
    clearAutoAdvance();
    state.elapsedMs = Math.max(0, sec*1000);
    if (state.running) state.startEpoch = performance.now() - state.elapsedMs;
    renderNowNext();
  }
  function startTicking(){
    stopTicking();
    tickTimer = setInterval(renderNowNext, 240);
  }
  function stopTicking(){
    if (tickTimer){ clearInterval(tickTimer); tickTimer=null; }
  }

  /* ---------------- render ---------------- */
  function renderAll(){
    renderShell();
  }

  function renderShell(){
    var app = document.getElementById('app');
    var song = currentSong();
    app.innerHTML =
      '<div class="header">'+
        '<div class="header-top">'+
          '<div class="brand">'+
            '<span class="brand-mark">スイッチ<span class="dot">キュー</span></span>'+
            '<span class="save-status'+(state.lastSaveOk===false?' bad':'')+'" id="saveStatus"><span class="dot"></span><span class="label">'+(state.db?'クラウド保存':'この端末に保存')+'</span></span>'+
          '</div>'+
          '<div class="hdr-actions">'+
            '<button class="icon-btn" id="exportBtn" title="バックアップをファイルに書き出す">⬇</button>'+
            '<button class="icon-btn" id="importBtn" title="バックアップファイルを読み込む">⬆</button>'+
            '<input type="file" id="importInput" accept="application/json" style="display:none">'+
            '<div class="mode-toggle'+(state.editMode?' on':'')+'" id="modeToggle"><div class="switch"></div><span>'+(state.editMode?'編集中':'編集')+'</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="songrail" id="songrail"></div>'+
      '</div>'+
      '<div class="main" id="main"></div>'+
      '<div class="transport" id="transport" style="position:relative;"></div>'+
      '<div class="toast" id="toast"></div>';

    els.songrail = document.getElementById('songrail');
    els.main = document.getElementById('main');
    els.transport = document.getElementById('transport');

    document.getElementById('modeToggle').onclick = function(){
      state.editMode = !state.editMode;
      state.editingCueId = null;
      state.editingSongTitle = false;
      state.editingDuration = false;
      renderAll();
    };
    document.getElementById('exportBtn').onclick = exportBackup;
    document.getElementById('importBtn').onclick = function(){
      document.getElementById('importInput').click();
    };
    document.getElementById('importInput').addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if (file) importBackupFile(file);
      e.target.value = '';
    });

    renderSongRail();
    renderMain();
    renderTransport();
  }

  function renderSongRail(){
    var html = '';
    state.songs.forEach(function(s){
      var active = s.id===state.selectedId;
      html += '<div class="chip'+(active?' active':'')+'" data-id="'+s.id+'" title="'+(s.analyzed?'動画解析ずみ（要確認）':'テンプレート（未確認）')+'">'+
        '<span class="num">'+String(s.order).padStart(2,'0')+'</span><span>'+escapeHtml(s.title)+'</span>'+
        '<span class="status-dot" style="width:6px;height:6px;border-radius:50%;flex:none;background:'+(s.analyzed?'var(--ok)':'var(--text-faint)')+';opacity:'+(s.analyzed?'1':'.5')+';"></span>'+
        (state.editMode ? '<span class="chip-x" data-del="'+s.id+'">×</span>' : '')+
      '</div>';
    });
    if (state.editMode){
      html += '<div class="chip add" id="addSongChip">+ 曲を追加</div>';
    }
    els.songrail.innerHTML = html;
    els.songrail.querySelectorAll('.chip[data-id]').forEach(function(chip){
      chip.addEventListener('click', function(e){
        if (e.target.dataset.del) return;
        if (chip.dataset.id !== state.selectedId){
          clearAutoAdvance();
          state.running = false;
          stopTicking();
          state.elapsedMs = 0;
        }
        state.selectedId = chip.dataset.id;
        state.editingCueId = null;
        state.editingSongTitle = false;
        state.editingDuration = false;
        state.addingCue = false;
        state.lastCurrentCueId = undefined;
        renderTransport();
        renderMain();
        renderNowNext();
      });
    });
    els.songrail.querySelectorAll('[data-del]').forEach(function(x){
      x.addEventListener('click', function(e){
        e.stopPropagation();
        if (confirm('この曲を削除しますか？')) deleteSong(x.dataset.del);
      });
    });
    var addChip = document.getElementById('addSongChip');
    if (addChip) addChip.addEventListener('click', addSong);
  }

  function renderMain(){
    var song = currentSong();
    if (!song){
      els.main.innerHTML = '<div class="empty-state">曲がありません。編集モードで曲を追加してください。</div>';
      return;
    }
    var cues = sortedCues(song);

    var titleHtml = state.editingSongTitle
      ? '<input class="song-title-input" id="songTitleInput" value="'+escapeHtml(song.title)+'">'
      : '<div class="song-title'+(state.editMode?' editable':'')+'" id="songTitleLabel">'+escapeHtml(song.title)+'</div>';

    var metaHtml = state.editingDuration
      ? '<input class="song-meta-input" id="songDurInput" value="'+fmtTime(song.durationSec)+'">'
      : '<div class="song-meta'+(state.editMode?' editable':'')+'" id="songDurLabel">全長 '+fmtTime(song.durationSec)+'</div>';

    els.main.innerHTML =
      '<div class="main-grid">'+
        '<div class="hero-col">'+
          '<div class="song-title-row">'+
            titleHtml+
            metaHtml+
          '</div>'+
          '<div class="caveat"><b>注記：</b>'+(song.analysisNote ? escapeHtml(song.analysisNote) : '秒数はリハ動画をもとにした目安（未解析のテンプレート）です。')+' 本番のテンポで前後するので、再生中に該当キューをタップすると、その場で時刻を合わせ直せます。</div>'+
          '<div class="timeline-wrap">'+
            '<div class="timeline" id="timeline">'+
              '<div class="timeline-fill" id="timelineFill"></div>'+
              cues.map(function(c){ return '<div class="timeline-mark" style="left:'+(c.time/song.durationSec*100)+'%"></div>'; }).join('')+
              '<div class="timeline-playhead" id="timelinePlayhead" style="left:0%"></div>'+
            '</div>'+
            '<div class="timeline-time"><span>0:00</span><span>'+fmtTime(song.durationSec)+'</span></div>'+
          '</div>'+
          '<div class="now-card" id="nowCard"></div>'+
          '<div class="next-strip" id="nextStrip"></div>'+
        '</div>'+
        '<div class="cue-col">'+
          '<div class="cue-list-head"><span>曲の展開</span><span>'+cues.length+' キュー</span></div>'+
          '<div class="cue-list" id="cueList"></div>'+
          (state.editMode ? '<button class="add-cue-btn" id="addCueBtn">＋ キューを追加</button>' : '')+
        '</div>'+
      '</div>';

    if (state.editingSongTitle){
      var input = document.getElementById('songTitleInput');
      input.focus(); input.select();
      var commit = function(){
        var v = input.value.trim() || song.title;
        state.editingSongTitle = false;
        writeSongField(song.id,'title',v);
      };
      input.addEventListener('keydown', function(e){ if (e.key==='Enter') commit(); if (e.key==='Escape'){state.editingSongTitle=false; renderMain();} });
      input.addEventListener('blur', commit);
    } else if (state.editMode){
      document.getElementById('songTitleLabel').addEventListener('click', function(){
        state.editingSongTitle = true;
        renderMain();
      });
    }

    if (state.editingDuration){
      var dinput = document.getElementById('songDurInput');
      dinput.focus(); dinput.select();
      var commitDur = function(){
        var v = parseTime(dinput.value);
        state.editingDuration = false;
        if (v!=null && v>0) writeSongField(song.id,'durationSec', v);
        else renderMain();
      };
      dinput.addEventListener('keydown', function(e){ if (e.key==='Enter') commitDur(); if (e.key==='Escape'){state.editingDuration=false; renderMain();} });
      dinput.addEventListener('blur', commitDur);
    } else if (state.editMode){
      var dlabel = document.getElementById('songDurLabel');
      if (dlabel) dlabel.addEventListener('click', function(){
        state.editingDuration = true;
        renderMain();
      });
    }

    renderCueList(song, cues);

    var addBtn = document.getElementById('addCueBtn');
    if (addBtn) addBtn.addEventListener('click', function(){
      var t = Math.round(elapsedSec());
      var cue = {id:uid(), time:t, label:'新しいパート', performer:'', note:''};
      var newCues = sortedCues(song).concat([cue]);
      writeCues(song.id, newCues);
      state.editingCueId = cue.id;
      renderMain();
    });

    renderNowNext();
  }

  function renderCueList(song, cues){
    var list = document.getElementById('cueList');
    if (!list) return;
    if (cues.length===0){
      list.innerHTML = '<div class="empty-state">キューがありません。「＋ キューを追加」で追加してください。</div>';
      return;
    }
    var t = elapsedSec();
    var cn = findCurrentAndNext(cues, t);
    list.innerHTML = cues.map(function(c){
      var isCurrent = cn.current && cn.current.id===c.id;
      var isPast = !isCurrent && c.time < t;
      if (state.editingCueId===c.id){
        return '<div class="cue-row" data-editrow="'+c.id+'">'+
          '<div class="cue-edit-form">'+
            '<div class="cue-edit-row">'+
              '<input class="f-time" id="ef_time_'+c.id+'" value="'+fmtTime(c.time)+'" placeholder="0:00">'+
              '<input class="f-label" id="ef_label_'+c.id+'" value="'+escapeHtml(c.label)+'" placeholder="パート名 (例: サビ)">'+
            '</div>'+
            '<div class="cue-edit-row">'+
              '<input class="f-performer" id="ef_performer_'+c.id+'" value="'+escapeHtml(c.performer)+'" placeholder="担当 (例: Vo メイン)">'+
            '</div>'+
            '<div class="cue-edit-row">'+
              '<input class="f-note" id="ef_note_'+c.id+'" value="'+escapeHtml(c.note||'')+'" placeholder="メモ（任意）">'+
            '</div>'+
            '<div class="cue-edit-actions">'+
              '<button class="btn btn-cancel" id="ef_cancel_'+c.id+'">キャンセル</button>'+
              '<button class="btn btn-save" id="ef_save_'+c.id+'">保存</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      }
      return '<div class="cue-row'+(isCurrent?' current':'')+(isPast?' past':'')+'" data-cueid="'+c.id+'">'+
        '<div class="cue-time">'+fmtTime(c.time)+'</div>'+
        '<div class="cue-body">'+
          '<div class="cue-label">'+escapeHtml(c.label)+'</div>'+
          (c.performer
            ? '<span class="cue-performer" style="'+performerStyle(c.performer)+'">'+escapeHtml(c.performer)+'</span>'
            : (state.editMode ? '<span class="cue-performer empty">担当未設定</span>' : ''))+
          (c.note ? '<div class="cue-note">'+escapeHtml(c.note)+'</div>' : '')+
        '</div>'+
        (state.editMode ? '<div class="cue-actions">'+
          '<button class="icon-btn" data-edit="'+c.id+'">✎</button>'+
          '<button class="icon-btn danger" data-del="'+c.id+'">×</button>'+
        '</div>' : '')+
      '</div>';
    }).join('');

    list.querySelectorAll('[data-cueid]').forEach(function(row){
      row.addEventListener('click', function(e){
        if (e.target.closest('[data-edit],[data-del]')) return;
        if (state.editMode) return;
        var target = cues.find(function(c){ return c.id===row.dataset.cueid; });
        if (target) jumpTo(target.time);
      });
    });
    list.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        state.editingCueId = btn.dataset.edit;
        renderCueList(song, cues);
      });
    });
    list.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var newCues = cues.filter(function(c){return c.id!==btn.dataset.del;});
        writeCues(song.id, newCues);
      });
    });
    cues.forEach(function(c){
      var saveBtn = document.getElementById('ef_save_'+c.id);
      var cancelBtn = document.getElementById('ef_cancel_'+c.id);
      if (saveBtn){
        saveBtn.addEventListener('click', function(){
          var timeVal = parseTime(document.getElementById('ef_time_'+c.id).value);
          var newCue = {
            id:c.id,
            time: timeVal==null ? c.time : timeVal,
            label: document.getElementById('ef_label_'+c.id).value.trim() || c.label,
            performer: document.getElementById('ef_performer_'+c.id).value.trim(),
            note: document.getElementById('ef_note_'+c.id).value.trim()
          };
          var newCues = sortedCues(song).map(function(x){ return x.id===c.id ? newCue : x; });
          state.editingCueId = null;
          writeCues(song.id, newCues);
        });
      }
      if (cancelBtn){
        cancelBtn.addEventListener('click', function(){
          state.editingCueId = null;
          renderCueList(song, cues);
        });
      }
    });
  }

  function renderNowNext(){
    var song = currentSong();
    if (!song) return;
    var cues = sortedCues(song);
    var t = elapsedSec();
    var cn = findCurrentAndNext(cues, t);

    var nowCard = document.getElementById('nowCard');
    if (nowCard){
      if (cn.current){
        nowCard.className = 'now-card'+(state.running?' live':'');
        nowCard.innerHTML =
          '<div class="now-eyebrow">NOW　'+fmtTime(t)+' / '+fmtTime(song.durationSec)+'</div>'+
          '<div class="now-label">'+escapeHtml(cn.current.label)+'</div>'+
          (cn.current.performer
            ? '<span class="now-performer" style="'+performerStyle(cn.current.performer)+'">'+escapeHtml(cn.current.performer)+'</span>'
            : '<span class="now-empty">担当未設定</span>')+
          (cn.current.note ? '<div class="now-note">'+escapeHtml(cn.current.note)+'</div>' : '');
      } else {
        nowCard.className = 'now-card';
        nowCard.innerHTML = '<div class="now-eyebrow">NOW　'+fmtTime(t)+' / '+fmtTime(song.durationSec)+'</div><div class="now-empty">再生するとここに現在のパートが表示されます</div>';
      }
    }

    var nextStrip = document.getElementById('nextStrip');
    if (nextStrip){
      if (cn.next){
        var eta = cn.next.time - t;
        var soon = eta <= 6;
        nextStrip.className = 'next-strip'+(soon?' soon':'');
        nextStrip.innerHTML =
          '<span class="tag">NEXT</span>'+
          '<span class="body">'+escapeHtml(cn.next.label)+(cn.next.performer ? '　→ '+escapeHtml(cn.next.performer) : '')+'</span>'+
          '<span class="eta">-'+fmtTime(eta)+'</span>';
      } else {
        nextStrip.className = 'next-strip';
        nextStrip.innerHTML = '<span class="tag">NEXT</span><span class="body">この曲の最後のキューです</span>';
      }
    }

    var fill = document.getElementById('timelineFill');
    var playhead = document.getElementById('timelinePlayhead');
    if (fill && playhead){
      var pct = Math.min(100, Math.max(0, t/song.durationSec*100));
      fill.style.width = pct+'%';
      playhead.style.left = pct+'%';
    }

    if (state.running && t >= song.durationSec && !state.autoAdvanceTimer){
      showToast('この曲は終了です。'+Math.round(AUTO_ADVANCE_DELAY_MS/1000)+'秒後に次の曲へ移動します');
      state.autoAdvanceTimer = setTimeout(function(){
        state.autoAdvanceTimer = null;
        advanceToNextSong();
      }, AUTO_ADVANCE_DELAY_MS);
    }

    if (cn.current && cn.current.id !== state.lastCurrentCueId){
      state.lastCurrentCueId = cn.current ? cn.current.id : undefined;
      renderCueList(song, cues);
      scrollToCurrent();
    } else if (!cn.current) {
      renderCueList(song, cues);
    }

    var clock = document.getElementById('clockDisplay');
    if (clock) clock.textContent = fmtTime(t);
  }

  function scrollToCurrent(){
    var row = document.querySelector('.cue-row.current');
    if (row) row.scrollIntoView({block:'center', behavior:'smooth'});
  }

  function renderTransport(){
    els.transport.innerHTML =
      '<div class="clock" id="clockDisplay">0:00</div>'+
      '<button class="t-btn" id="nudgeBackBtn">−5s</button>'+
      '<button class="t-btn" id="resetBtn">戻す</button>'+
      '<button class="t-play'+(state.running?' playing':'')+'" id="playBtn">'+(state.running?'❚❚':'▶')+'</button>'+
      '<button class="t-btn" id="nudgeFwdBtn">+5s</button>';
    document.getElementById('playBtn').addEventListener('click', function(){
      if (state.running) pause(); else play();
    });
    document.getElementById('resetBtn').addEventListener('click', reset);
    document.getElementById('nudgeBackBtn').addEventListener('click', function(){ nudge(-5); });
    document.getElementById('nudgeFwdBtn').addEventListener('click', function(){ nudge(5); });
  }

  initDb();
  renderAll();
})();
</script>
